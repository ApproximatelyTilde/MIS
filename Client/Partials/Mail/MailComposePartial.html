<div class="MailComposeWrapper">
  <div class="MailComposeHeader">
    <span class="MailComposeTitle">COMPOSE MESSAGE</span>
  </div>

  <form hx-post="/API/Mail/Send" hx-target="#MailMessageContainer" hx-swap="innerHTML" class="MailComposeForm">
    {% if RelatedEntityType %}
      <input type="hidden" name="RelatedEntityType" value="{{ RelatedEntityType }}" />
    {% endif %}
    {% if RelatedEntityID %}
      <input type="hidden" name="RelatedEntityID" value="{{ RelatedEntityID }}" />
    {% endif %}

    <div class="FormRow MailComposeRow">
      <label class="FormLabel MailComposeLabel" for="MailComposeRecipient">Recipient:</label>
      <select id="MailComposeRecipient" name="RecipientUserID" class="FormInput MailComposeSelect" required>
        <option value="">-- Select Recipient User --</option>
        {% for UserItem in AvailableUsers %}
          <option value="{{ UserItem.ID }}" {% if UserItem.ID == RecipientUserID %}selected{% endif %}>
            {{ UserItem.DisplayName }} ({{ UserItem.Role.value }})
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="FormRow MailComposeRow">
      <label class="FormLabel MailComposeLabel" for="MailComposeSubject">Subject:</label>
      <input type="text" id="MailComposeSubject" name="Subject" class="FormInput MailComposeInput" value="{{ Subject }}" placeholder="Enter message subject..." required />
    </div>

    <div class="FormRow MailComposeRow">
      <label class="FormLabel MailComposeLabel" for="MailComposeCategory">Category:</label>
      <select id="MailComposeCategory" name="Category" class="FormInput MailComposeSelect" required>
        {% for Cat in Categories %}
          <option value="{{ Cat }}" {% if Cat == Category %}selected{% endif %}>{{ Cat }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="FormRow MailComposeRow MailComposeBodyRow">
      <label class="FormLabel MailComposeLabel" for="MailComposeBody">Message:</label>
      <textarea id="MailComposeBody" name="Body" class="FormInput MailComposeTextarea" placeholder="Write message body here..." required>{{ BodyTemplate }}</textarea>
    </div>

    <div class="FlexSpaceBetween MarginTopSmall">
      <button type="button" class="Button MailCancelButton" hx-get="/API/Mail/Placeholder/Partial" hx-target="#MailMessageContainer" hx-swap="innerHTML">
        <span>Cancel</span>
      </button>
      <button type="submit" class="Button ButtonPrimary MailTransmitButton">
        <span>Send Message</span>
      </button>
    </div>
  </form>
</div>
