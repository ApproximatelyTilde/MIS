<div class="MailComposeSuccessContainer">
  <div class="MailNoticeBanner">Message successfully sent to {{ SentCount }} recipient(s).</div>
  <div class="MailMessageBody">
    <div class="MailMessageSubjectLine">
      <span class="MailSubjectLabel">SUBJECT:</span>
      <span class="MailSubjectValue">{{ Subject }}</span>
    </div>
  </div>
  <div class="FlexCenter MarginTopLarge">
    <button type="button" class="Button ButtonPrimary" id="MailComposeSuccessCloseButton">
      <span>Close Window</span>
    </button>
  </div>
</div>
